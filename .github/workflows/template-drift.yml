name: Federation template drift

# Shared launchers and schemas remain byte-identical to the pinned federation
# templates. Phase 0 intentionally replaces the legacy Gatekeeper bypass and
# mutable desktop dependency template with repository-local hardened contracts.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    env:
      THEHUB_SHA: f00f2da0e6abcc885a8133e5c8b7aeb9756f5df8
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned federation templates
        run: |
          git init ../thehub-pr
          git -C ../thehub-pr remote add origin https://github.com/jotaele44/thehub-pr.git
          git -C ../thehub-pr fetch --depth 1 origin "$THEHUB_SHA"
          git -C ../thehub-pr checkout --detach FETCH_HEAD
          test "$(git -C ../thehub-pr rev-parse HEAD)" = "$THEHUB_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyyaml
      - name: Render pinned templates into isolated directory
        run: |
          mkdir -p /tmp/skywatcher-rendered
          python ../thehub-pr/tools/render_federation_templates.py \
            --repo skywatcher-pr \
            --repo-root /tmp/skywatcher-rendered
      - name: Compare adopted canonical artifacts
        run: |
          cmp PRII-SKYWATCHER.command /tmp/skywatcher-rendered/PRII-SKYWATCHER.command
          cmp PRII-SKYWATCHER.bat /tmp/skywatcher-rendered/PRII-SKYWATCHER.bat
          cmp PRII-SKYWATCHER.sh /tmp/skywatcher-rendered/PRII-SKYWATCHER.sh
          cmp schemas/federation_export_manifest.schema.json \
            /tmp/skywatcher-rendered/schemas/federation_export_manifest.schema.json
          test -x PRII-SKYWATCHER.command
          test -x PRII-SKYWATCHER.sh
      - name: Validate sanctioned Phase 0 divergences
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          assert not Path("Fix-Gatekeeper.command").exists(), "legacy trust-bypass helper must remain absent"

          desktop = Path("requirements-desktop.txt").read_text(encoding="utf-8")
          assert "-e .[desktop,federation]" in desktop
          assert "-e ../thehub-pr" not in desktop

          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          deps = project["project"]["optional-dependencies"]
          pin = os.environ["THEHUB_SHA"]
          shared = [item for item in deps["desktop"] + deps["federation"] if "prii-" in item]
          assert shared
          assert all(f"thehub-pr.git@{pin}#subdirectory=" in item for item in shared)
          print("adopted templates match; hardened divergences validated")
          PY
