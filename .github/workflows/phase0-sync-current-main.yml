name: Phase 0 current-main merge probe

on:
  push:
    branches:
      - agent/repository-hardening-phase-0
    paths:
      - .github/workflows/phase0-sync-current-main.yml

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: agent/repository-hardening-phase-0
      - name: Probe and publish exact current-main merge ledger
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          expected_main=09c8928109e25a3651f09ffff4c9414f0c83fdac
          git fetch origin main
          actual_main=$(git rev-parse origin/main)
          test "$actual_main" = "$expected_main"
          feature_head=$(git rev-parse HEAD)
          git config user.name phase0-sync-probe
          git config user.email actions@users.noreply.github.com
          set +e
          git merge --no-commit --no-ff "$actual_main"
          rc=$?
          set -e
          conflicts=$(git diff --name-only --diff-filter=U | sort)
          staged=$(git diff --cached --name-only | sort)
          body=$(cat <<EOF
          ## Phase 0 merge conflict probe

          - Feature head: \`$feature_head\`
          - Main head: \`$actual_main\`
          - Merge exit: \`$rc\`

          ### Unmerged paths

          \`\`\`
          $conflicts
          \`\`\`

          ### Cleanly staged mainline paths

          \`\`\`
          $staged
          \`\`\`

          Probe only: no commit or push was performed.
          EOF
          )
          gh api repos/${{ github.repository }}/issues/126/comments -f body="$body"
          if [ "$rc" -eq 0 ]; then
            git merge --abort
          fi
          exit "$rc"
