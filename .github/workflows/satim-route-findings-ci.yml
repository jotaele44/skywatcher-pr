name: SATIM Route Findings CI

on:
  push:
    paths:
      - 'tools/satim_route_findings/**'
      - '.github/workflows/satim-route-findings-ci.yml'
  pull_request:
    paths:
      - 'tools/satim_route_findings/**'
      - '.github/workflows/satim-route-findings-ci.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-route-findings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
          cache: pip
      - name: Assert isolated checkout
        run: test ! -e "$GITHUB_WORKSPACE/../thehub-pr"
      - name: Install package
        working-directory: tools/satim_route_findings
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          test ! -e "$GITHUB_WORKSPACE/../thehub-pr"
      - name: Run tests
        working-directory: tools/satim_route_findings
        run: pytest -q
      - name: Smoke test CLI
        working-directory: tools/satim_route_findings
        run: |
          mkdir -p /tmp/satim_route_findings_out
          satim-route-findings --input tests/fixtures --output /tmp/satim_route_findings_out
          test -f /tmp/satim_route_findings_out/route_findings_report.md
