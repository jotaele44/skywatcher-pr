profile_id: satellite_imagery_standard
name: Satellite imagery - standard analysis
version: 1.1.0
status: active
description: Default objective for a satellite image processing run. Artifact assessment is required because every other imagery lens depends on artifact exclusion having happened first. Interpretive lenses are optional so a run is not blocked when imagery contains none of their subjects. Landscape morphology precedes specialized agricultural-mosaic interpretation when those lenses are invoked.
stages:
  - satellite_image_processing
required_lenses:
  - satim.image_artifacts
optional_lenses:
  - satim.landscape_morphology
  - satim.agricultural_mosaic
  - satim.hydrogeography
  - satim.subsurface_infrastructure
  - satim.dual_use_function
