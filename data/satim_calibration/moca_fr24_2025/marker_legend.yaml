calibration_id: SATIM-CAL-MOCA-C6038_v1
source_context:
  platform: Flightradar24
  view_mode: 3D mobile screenshot
  aircraft_label: C6038 / CG638 / H60
  aircraft_type: Sikorsky MH-60T Jayhawk
  area_label: Moca / Antigua Escuela de Moca
  evidence_tier: T2_operational_screenshot
marker_classes:
  dotted_line:
    meaning: imagery_seam_observation
    satim_role: imagery_seam_observation_detection
    origin_identity: unresolved_until_origin_specific_gates_pass
    allowed_origin_candidates:
      - SOURCE_MOSAIC_CUTLINE
      - DISPLAY_TILE_EDGE
      - VIEWPORT_COMPOSITING_ARTIFACT
      - NATURAL_SHADOW_BOUNDARY
      - PHYSICAL_GROUND_FEATURE
      - COMPRESSION_OR_RESAMPLING_ARTIFACT
      - UNRESOLVED
    forbidden_promotions:
      - visual_seam_to_display_tile_edge_without_provider_tile_grid_binding
      - visual_seam_to_physical_ground_feature_without_independent_ground_binding
      - screen_lock_to_display_tile_edge
    expected_false_positives:
      - app_tile_loading
      - 3d_lod_transition
      - canopy_shadow_edge
      - source_mosaic_cutline
      - viewport_compositing_artifact
  squiggle:
    meaning: smudge_or_texture_loss
    satim_role: texture_frequency_anomaly_scoring
    expected_false_positives:
      - canopy_shadow
      - compression_blur
      - oblique_texture_stretching
  triangle:
    meaning: body_of_water_pool_or_cistern
    satim_role: known_feature_class
    expected_false_positives:
      - roof_reflection
      - blue_roof_material
  straight_line:
    meaning: geometry_warp_or_slanted_edge
    satim_role: perspective_and_orthorectification_check
    expected_false_positives:
      - oblique_3d_perspective
      - roof_pitch
      - terrain_drape
  x:
    meaning: palm_tree
    satim_role: vegetation_false_positive_class
    expected_false_positives:
      - isolated_tree_crown
      - bright_leaf_reflectance
  circle:
    meaning: unusual_object_or_shadow
    satim_role: ambiguous_candidate_class
    expected_false_positives:
      - shadow_pool
      - small_clearing
      - isolated_tree_crown
promotion_checks:
  - frame_to_frame_repeatability
  - cross_source_persistence
  - geometry_coherence
  - false_positive_screening
  - pan_coordinate_behavior
  - adjacent_zoom_ground_persistence
  - provider_tile_grid_binding_for_display_tile_edge
  - independent_ground_binding_for_physical_feature
  - source_mosaic_metadata_for_source_mosaic_pass
