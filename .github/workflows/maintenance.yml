name: maintenance

on:
  workflow_dispatch:
  schedule:
    - cron: "37 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  maintenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - name: Assert isolated checkout
        run: test ! -e "$GITHUB_WORKSPACE/../thehub-pr"
      - name: Install
        run: |
          command -v uv >/dev/null 2>&1 || python -m pip install -q uv
          uv sync
      - name: Maintenance tests
        run: uv run pytest tests/test_maintenance.py -q
      - name: Audit run
        run: uv run python3 scripts/run_maintenance.py --repo skywatcher-pr --mode audit --json
      - name: Upload maintenance report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: skywatcher-maintenance-report
          path: reports/maintenance/latest.json
          if-no-files-found: ignore
