name: Ruff order probe

on:
  push:
    branches:
      - feat/visual-reasoning-runtime-v0-2

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.16.3
      - name: Show Ruff import-order fix
        run: |
          ruff check --select I --fix src/skywatcher/satim/visual_reasoning_runtime.py || true
          git diff -- src/skywatcher/satim/visual_reasoning_runtime.py
