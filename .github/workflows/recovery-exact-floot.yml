name: Exact Floot recovery - Skywatcher
on:
  push:
    branches:
      - recovery/floot-baseline-2026-09-30
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-floot-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
      - name: Execute exact recovered tree
        shell: bash
        run: bash .recovery/skywatcher-exact/run_exact.sh
      - name: Stage recovery evidence
        if: always()
        shell: bash
        run: |
          rm -rf recovery-output
          mkdir -p recovery-output
          if [ -d "$RUNNER_TEMP/recovered" ]; then
            for f in package.original.json package.json package-lock.json recovery-member-manifest.txt recovery-hashes.txt recovery-environment.txt recovery-vitest.log recovery-test-exit.txt recovery-spec-files.txt recovery-spec-classification.tsv; do
              cp "$RUNNER_TEMP/recovered/$f" recovery-output/ 2>/dev/null || true
            done
          fi
      - name: Upload recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skywatcher-exact-floot-recovery
          if-no-files-found: error
          path: recovery-output
      - name: Enforce suite result
        if: always()
        shell: bash
        run: |
          test -f "$RUNNER_TEMP/recovered/recovery-test-exit.txt"
          exit "$(cat "$RUNNER_TEMP/recovered/recovery-test-exit.txt")"
