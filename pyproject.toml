# skywatcher-pr is a flat-layout airspace producer (modules at repo root,
# importing each other as top-level names). It is run as an application, not
# installed as a package, so there is no build-system here — pytest discovers
# the root modules via pythonpath. "src" is also on the path so the
# src/skywatcher package (registry/correlation helpers) is importable.
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
# Integration tests hit live external services (e.g. NASA GIBS); excluded from
# default runs. Run them explicitly with:  pytest -m integration
addopts = "-m 'not integration'"
markers = [
    "integration: tests that hit live external services. Excluded from default runs.",
]

# ── ruff ─────────────────────────────────────────────────────────────────────
# Same rule set as the rest of the federation so the target is identical
# everywhere. The backlog this repo started with (1,369 findings) is cleared
# apart from the two entries below, and the CI lint job is GATING — see ci.yml.
#
# target-version MUST stay py310: it is the lowest version in ci.yml's matrix,
# and at a py312 target ruff's UP017 rewrites `timezone.utc` to `datetime.UTC`,
# which does not exist before 3.11 and breaks the 3.10 leg at import time. That
# regression already happened once, in ovnis-pr.
[tool.ruff]
line-length = 100
target-version = "py310"
src = [".", "src", "tests"]
extend-exclude = ["Archive.zip", "gebco", "exports", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "W"]
# Every entry here is DELIBERATE, not a backlog. Nothing is parked pending
# cleanup — the rest of the original 1,369 findings were fixed rather than
# ignored. Do not add to this list to make a build pass: fix the finding, or if
# the code is genuinely intentional, add a targeted `# noqa` with a reason at the
# site so it is visible where it matters.
ignore = [
    # Line length is the formatter's concern, not the linter's.
    "E501",
    # 16 sites, all deliberate. The backward-compat shims at the repo root must
    # bootstrap `src` onto sys.path BEFORE importing from `skywatcher.*`, so the
    # import genuinely cannot come first. Enforcing this would mean breaking the
    # shims. See docs/ADR_SKYWATCHER_MODULE_BOUNDARIES.md.
    "E402",
    # 4 sites, all in scripts/parse_flight_log.py, and VERIFIED BENIGN: the
    # `cell = lambda c: ...` closure is called within the same loop iteration, so
    # late binding cannot bite. Ruff cannot prove the lambda does not escape.
    # Recorded here so nobody re-investigates it a third time.
    "B023",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"] # assert False is idiomatic in tests

# ── mypy ─────────────────────────────────────────────────────────────────────
# Gradually-typed baseline, matching spiderweb-pr and moneysweep-pr. Scoped to
# the src/skywatcher package, which is the structured part of the tree (13
# findings today; src/skywatcher/satim/artifacts is already clean). The flat
# root modules and fr24/ are not in scope yet. follow_imports = "silent" keeps
# errors in not-yet-typed dependencies from being reported. Non-gating in CI.
[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
follow_imports = "silent"
files = ["src/skywatcher"]

[tool.coverage.run]
branch = true
source = ["src/skywatcher", "fr24", "imagery", "pipeline"]
omit = ["tests/*", "*/__init__.py"]

[tool.coverage.report]
# Ratchet, not a target: 59% measured when this landed, floor set at
# 55% so normal variation across the CI Python matrix does not cause false
# failures. Raise it as coverage improves; never lower it to make a build pass.
fail_under = 55
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
