# skywatcher-pr is a flat-layout airspace producer (modules at repo root,
# importing each other as top-level names). It is run as an application, not
# installed as a package, so there is no build-system here — pytest discovers
# the root modules via pythonpath. "src" is also on the path so the
# src/skywatcher package (registry/correlation helpers) is importable.
#
# Dependencies below used to be spread across 8 separate requirements*.txt
# files with real duplication between them (Pillow, numpy, jsonschema,
# python-dotenv, pillow-heif each redeclared 2-4x). Consolidated here as one
# [project] + extras, matching the aguayluz-pr/centinelas-pr/thehub-pr
# pattern. `tool.uv.package = false` keeps this a dependency-only ("virtual")
# project — uv resolves and locks the extras below without trying to build
# skywatcher-pr itself as an installable package, matching the flat-layout
# note above.
[project]
name = "skywatcher-pr"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "Pillow>=10.0",
    "PyMuPDF>=1.28.2",
    "pytest>=8.0",
    "pillow-heif>=1.5.0; platform_system != 'Windows'",
    # Manual flight-log workbooks (.xlsx) read by fr24/log_verify.py. Imported
    # lazily at the call site, so only log-verification runs pay the import cost.
    "openpyxl>=3.1",
    # Draft 2020-12 JSON Schema validation for the SATIM artifact-assessment
    # protocol (src/skywatcher/satim/artifacts) and the federation contract-
    # compat tests.
    "jsonschema>=4.20",
    # Shared federation libraries, pinned via [tool.uv.sources] below to an
    # immutable TheHub commit. No thehub-pr sibling checkout is needed.
    "prii-maintenance",
    "prii-export-utils",
]

[project.optional-dependencies]
# ADS-B automated aircraft-state-vector poll. Entry point: python scripts/adsb_poll.py
# Provider: OpenSky Network (free; OAuth2 client-credentials, anonymous fallback).
adsb = [
    "opensky-api",
    "python-dotenv>=1.2.3",
]
dev = [
    "pytest-cov>=5",
]
# FR24 screenshot-processing (skywatcher-pr owns FR24, transferred from
# spiderweb-pr as part of the repository-boundary correction). Optional: the
# consolidated skywatcher.fr24 package imports these lazily, so unit tests
# using synthetic data do not require this stack.
#
# SYSTEM PREREQUISITE (not a pip package): the Tesseract OCR engine must be
# installed out of band, e.g. `apt-get install tesseract-ocr` or `brew install tesseract`.
fr24 = [
    "pytesseract>=0.3.13,<0.4",  # Tesseract OCR bindings (fr24 OCR modules)
    "opencv-python>=4.8,<5",     # UI segmentation / route + track vectorization
    "numpy>=1.24",               # affine coordinate fitting / vectorization
    "pyarrow>=14.0",             # columnar export (Parquet)
]
# Optional GEBCO bathymetry/terrain layer (gebco/). Heavy geospatial stack;
# not required for the core airspace engine or the federation export contract.
geo = [
    "numpy>=1.24",
    # Upper-bounded below 1.18: newer scipy releases require Python >=3.12,
    # which breaks the universal lock across this project's 3.10-3.12 matrix.
    "scipy>=1.11,<1.18",
    "xarray>=2023.1",
    "netCDF4>=1.6",
]
# Imagery MCP server — fetch/search/compare satellite imagery over MCP.
# Entry point: python -m imagery.server
# Providers: NASA GIBS (no auth), Sentinel Hub, Copernicus/CDSE (OAuth2).
imagery = [
    "fastmcp>=2.9,<3",
    "requests>=2.34.2",
    "python-dotenv>=1.2.3",
    "numpy",
]

[tool.uv]
package = false

[tool.uv.sources]
prii-maintenance = { git = "https://github.com/jotaele44/thehub-pr.git", rev = "f2b81769924689b4d959554928810b1d7b7ef3d6", subdirectory = "packages/prii_maintenance" }
prii-export-utils = { git = "https://github.com/jotaele44/thehub-pr.git", rev = "f2b81769924689b4d959554928810b1d7b7ef3d6", subdirectory = "packages/prii_export_utils" }
opensky-api = { git = "https://github.com/openskynetwork/opensky-api.git", rev = "16e3803d2495d0029bebc3c85b2a235eeb122742", subdirectory = "python" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
# Integration tests hit live external services (e.g. NASA GIBS); excluded from
# default runs. Run them explicitly with:  pytest -m integration
addopts = "-m 'not integration'"
markers = [
    "integration: tests that hit live external services. Excluded from default runs.",
]

# ── ruff ─────────────────────────────────────────────────────────────────────
# Same rule set as the rest of the federation so the target is identical
# everywhere. The backlog this repo started with (1,369 findings) is cleared
# apart from the two entries below, and the CI lint job is GATING — see ci.yml.
#
# target-version MUST stay py310: it is the lowest version in ci.yml's matrix,
# and at a py312 target ruff's UP017 rewrites `timezone.utc` to `datetime.UTC`,
# which does not exist before 3.11 and breaks the 3.10 leg at import time. That
# regression already happened once, in ovnis-pr.
[tool.ruff]
line-length = 100
target-version = "py310"
src = [".", "src", "tests"]
# docs/architecture/archive holds the byte-frozen pre-unfreeze ontology baseline
# (ADR v2.1 A0), including a copy of the OLD governance test. Those bytes must not
# change — their SHA-256 values are asserted — so no linter or formatter may touch
# them. pytest already skips it via testpaths = ["tests"].
extend-exclude = ["Archive.zip", "gebco", "exports", "data", "docs/architecture/archive"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "W"]
# Every entry here is DELIBERATE, not a backlog. Nothing is parked pending
# cleanup — the rest of the original 1,369 findings were fixed rather than
# ignored. Do not add to this list to make a build pass: fix the finding, or if
# the code is genuinely intentional, add a targeted `# noqa` with a reason at the
# site so it is visible where it matters.
ignore = [
    # Line length is the formatter's concern, not the linter's.
    "E501",
    # 16 sites, all deliberate. The backward-compat shims at the repo root must
    # bootstrap `src` onto sys.path BEFORE importing from `skywatcher.*`, so the
    # import genuinely cannot come first. Enforcing this would mean breaking the
    # shims. See docs/ADR_SKYWATCHER_MODULE_BOUNDARIES.md.
    "E402",
    # 4 sites, all in scripts/parse_flight_log.py, and VERIFIED BENIGN: the
    # `cell = lambda c: ...` closure is called within the same loop iteration, so
    # late binding cannot bite. Ruff cannot prove the lambda does not escape.
    # Recorded here so nobody re-investigates it a third time.
    "B023",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"] # assert False is idiomatic in tests

# ── mypy ─────────────────────────────────────────────────────────────────────
# Gradually-typed baseline, matching spiderweb-pr and moneysweep-pr. Scoped to
# the src/skywatcher package, which is the structured part of the tree (13
# findings today; src/skywatcher/satim/artifacts is already clean). The flat
# root modules and fr24/ are not in scope yet. follow_imports = "silent" keeps
# errors in not-yet-typed dependencies from being reported. Non-gating in CI.
[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
follow_imports = "silent"
files = ["src/skywatcher"]

[tool.coverage.run]
branch = true
source = ["src/skywatcher", "fr24", "imagery", "pipeline"]
omit = ["tests/*", "*/__init__.py"]

[tool.coverage.report]
# Ratchet, not a target: 59% measured when this landed, floor set at
# 55% so normal variation across the CI Python matrix does not cause false
# failures. Raise it as coverage improves; never lower it to make a build pass.
fail_under = 55
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
