name: Skywatcher CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dev deps
        run: |
          if [ ! -d ../thehub-pr ]; then git clone --depth 1 --branch "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" https://github.com/jotaele44/thehub-pr.git ../thehub-pr || git clone --depth 1 https://github.com/jotaele44/thehub-pr.git ../thehub-pr; fi
          python -m pip install -r requirements-dev.txt httpx -r server/backend/requirements.txt
      - name: Federation manifest gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("federation.json").read_text())
          required = {
              "schema_version",
              "program_id",
              "repository_full_name",
              "federation_role",
              "hub_parent",
              "hub_callable_commands",
              "canonical_outputs",
              "federation_readiness_gate",
          }
          missing = sorted(required - set(manifest))
          assert not missing, f"federation.json missing required keys: {missing}"
          assert manifest["schema_version"] == "repo_federation_manifest_v1"
          assert manifest["program_id"] == "skywatcher-pr"
          assert manifest["hub_parent"] == "thehub-pr"
          assert "setup" in manifest["hub_callable_commands"]
          assert "test_suite" in manifest["hub_callable_commands"]
          gate = manifest["federation_readiness_gate"]
          assert isinstance(gate.get("ready_for_hub_discovery"), bool)
          assert isinstance(gate.get("ready_for_hub_live_execution"), bool)
          assert isinstance(gate.get("blocking_conditions"), list)
          print("federation manifest gate passed")
          PY
      - name: Validate airspace export contract (test mode passes, production rejects synthetic)
        run: |
          python scripts/validate_airspace_export.py exports/examples/synthetic_airspace_package --mode test
          if python scripts/validate_airspace_export.py exports/examples/synthetic_airspace_package --mode production; then
            echo "ERROR: production mode should reject synthetic rows" && exit 1
          else
            echo "OK: production mode correctly rejected synthetic rows"
          fi
      - name: Validate SATIM calibration sets
        run: python scripts/validate_satim_calibration.py data/satim_calibration
      - name: Tests
        run: pytest -q --cov --cov-report=term-missing:skip-covered

  test-imagery:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install imagery deps
        run: |
          if [ ! -d ../thehub-pr ]; then git clone --depth 1 --branch "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" https://github.com/jotaele44/thehub-pr.git ../thehub-pr || git clone --depth 1 https://github.com/jotaele44/thehub-pr.git ../thehub-pr; fi
          python -m pip install -r requirements-imagery.txt pytest
      - name: Imagery tests (mocked; live providers excluded)
        run: pytest tests/test_imagery_*.py -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Recompile the lockfile
        run: |
          if [ ! -d ../thehub-pr ]; then git clone --depth 1 --branch "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" https://github.com/jotaele44/thehub-pr.git ../thehub-pr || git clone --depth 1 https://github.com/jotaele44/thehub-pr.git ../thehub-pr; fi
          uv pip compile requirements.txt --universal --python-version 3.12 -o requirements.lock
      - name: Assert no drift
        run: |
          if ! git diff --exit-code requirements.lock; then
            echo "::error::requirements.lock is out of date with requirements.txt." \
              "Run: uv pip compile requirements.txt --universal --python-version 3.12 -o requirements.lock"
            exit 1
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install lint deps
        run: |
          if [ ! -d ../thehub-pr ]; then git clone --depth 1 --branch "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" https://github.com/jotaele44/thehub-pr.git ../thehub-pr || git clone --depth 1 https://github.com/jotaele44/thehub-pr.git ../thehub-pr; fi
          python -m pip install ruff mypy -r requirements-dev.txt
      - name: Ruff
        run: ruff check .
      - name: Mypy (report-only)
        continue-on-error: true
        run: python -m mypy

  phase0-sync:
    if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'agent/repository-hardening-phase-0' && github.head_ref == 'codex/phase0-sync-executor'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: agent/repository-hardening-phase-0
      - name: Adjudicate and push exact two-parent merge
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch=agent/repository-hardening-phase-0
          expected_feature=1bfaea7c37ff42d0614934b0553cf8aacad9bfcc
          expected_main=09c8928109e25a3651f09ffff4c9414f0c83fdac
          sync_pr=${{ github.event.pull_request.number }}

          git fetch origin "$branch" main
          feature_head=$(git rev-parse "origin/$branch")
          main_head=$(git rev-parse origin/main)
          test "$feature_head" = "$expected_feature"
          test "$main_head" = "$expected_main"
          git checkout -B "$branch" "origin/$branch"
          git config user.name phase0-sync-bot
          git config user.email actions@users.noreply.github.com

          set +e
          git merge --no-commit --no-ff "$main_head"
          merge_rc=$?
          set -e
          test "$merge_rc" -eq 1

          expected_conflicts=$(cat <<'EOF'
          fr24/rlsm_unlabeled.py
          fr24/satim_engine.py
          fr24/satim_engine_core.py
          scripts/federation_export.py
          scripts/rlsm_geocode_unlabeled.py
          scripts/rlsm_ocr_retry_tails.py
          src/skywatcher/fpim/aircraft_profile.py
          tests/test_aircraft_intelligence.py
          tests/test_fr24_todays_batch.py
          tests/test_maintenance.py
          tools/satim_engine/src/satim_engine/inventory.py
          EOF
          )
          actual_conflicts=$(git diff --name-only --diff-filter=U | sort)
          test "$actual_conflicts" = "$expected_conflicts"
          while IFS= read -r path; do
            git checkout --ours -- "$path"
            git add -- "$path"
          done <<< "$actual_conflicts"

          git show c1323992801230f5e076c524c9ac67ff96c74bbb:.github/workflows/ci.yml > .github/workflows/ci.yml
          git show c1323992801230f5e076c524c9ac67ff96c74bbb:pyproject.toml > pyproject.toml
          python - <<'PY'
          from pathlib import Path

          ci = Path('.github/workflows/ci.yml')
          text = ci.read_text()
          old = '''          manifest = json.load(open("federation.json", encoding="utf-8"))
          assert manifest["program_id"] == "skywatcher-pr"
          assert manifest["hub_parent"] == "thehub-pr"
          assert manifest["federation_readiness_gate"]["operational_cueing"] is False
          assert manifest["federation_readiness_gate"]["intent_inference"] is False
          '''
          new = '''          manifest = json.load(open("federation.json", encoding="utf-8"))
          required = {
              "schema_version", "program_id", "repository_full_name",
              "federation_role", "hub_parent", "hub_callable_commands",
              "canonical_outputs", "federation_readiness_gate",
          }
          missing = sorted(required - set(manifest))
          assert not missing, f"federation.json missing required keys: {missing}"
          assert manifest["program_id"] == "skywatcher-pr"
          assert manifest["hub_parent"] == "thehub-pr"
          gate = manifest["federation_readiness_gate"]
          assert isinstance(gate.get("ready_for_hub_discovery"), bool)
          assert isinstance(gate.get("ready_for_hub_live_execution"), bool)
          assert isinstance(gate.get("blocking_conditions"), list)
          assert gate["operational_cueing"] is False
          assert gate["intent_inference"] is False
          '''
          if old not in text:
              raise SystemExit('Phase 0 federation gate block missing')
          text = text.replace(old, new)
          old_lint = '''      - name: Ruff (report-only)
        continue-on-error: true
        run: ruff check --statistics .
          '''
          new_lint = '''      - name: Ruff
        run: ruff check .
          '''
          if old_lint not in text:
              raise SystemExit('Phase 0 Ruff block missing')
          ci.write_text(text.replace(old_lint, new_lint))

          pyproject = Path('pyproject.toml')
          text = pyproject.read_text()
          if 'ignore = ["E501"]' not in text:
              raise SystemExit('Phase 0 Ruff ignore list missing')
          pyproject.write_text(text.replace('ignore = ["E501"]', '''ignore = [
  "E501",
  "E402",
  "B023",
]'''))
          PY

          git rm -f .github/workflows/phase0-sync-current-main.yml
          git add -A
          test -z "$(git diff --name-only --diff-filter=U)"

          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,api]'
          python -m pip install -e 'tools/satim_engine[dev]'
          ruff check --fix .
          ruff check .
          git add -A
          git diff --check
          PYTEST_ADDOPTS='' pytest -q \
            tests/test_aircraft_intelligence.py \
            tests/test_fpim_quarantine.py \
            tests/test_backend_api_security.py \
            tests/test_repository_policy.py \
            tests/test_safe_archive.py \
            tests/test_maintenance.py \
            tests/test_fr24_todays_batch.py \
            tools/satim_engine/tests/test_safe_archive.py \
            tools/satim_engine/tests/test_inventory.py

          git commit -m 'Merge current main into Phase 0 branch'
          merge_sha=$(git rev-parse HEAD)
          parents=$(git rev-list --parents -n 1 HEAD)
          test "$(wc -w <<< "$parents")" -eq 3
          test "$(awk '{print $2}' <<< "$parents")" = "$feature_head"
          test "$(awk '{print $3}' <<< "$parents")" = "$main_head"
          git push origin "HEAD:$branch"

          gh api repos/${{ github.repository }}/issues/$sync_pr/comments -f body="## Phase 0 synchronization pushed\n\n- Feature parent: \`$feature_head\`\n- Current-main parent: \`$main_head\`\n- Two-parent merge: \`$merge_sha\`\n- Exact conflicts adjudicated: 11\n- Ruff gate: passed\n- Targeted Phase 0 tests: passed\n- PR #110 remains draft and unmerged."
