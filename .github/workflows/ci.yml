name: Skywatcher CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {contents: read}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dev deps
        run: python -m pip install -e ".[dev,api]"
      - name: Federation manifest gate
        run: |
          python - <<'PY'
          import json
          manifest = json.load(open("federation.json", encoding="utf-8"))
          required = {
              "schema_version", "program_id", "repository_full_name",
              "federation_role", "hub_parent", "hub_callable_commands",
              "canonical_outputs", "federation_readiness_gate",
          }
          missing = sorted(required - set(manifest))
          assert not missing, f"federation.json missing required keys: {missing}"
          assert manifest["program_id"] == "skywatcher-pr"
          assert manifest["hub_parent"] == "thehub-pr"
          gate = manifest["federation_readiness_gate"]
          assert isinstance(gate.get("ready_for_hub_discovery"), bool)
          assert isinstance(gate.get("ready_for_hub_live_execution"), bool)
          assert isinstance(gate.get("blocking_conditions"), list)
          assert gate["operational_cueing"] is False
          assert gate["intent_inference"] is False
          PY
      - name: Validate airspace export contract
        run: |
          python scripts/validate_airspace_export.py exports/examples/synthetic_airspace_package --mode test
          ! python scripts/validate_airspace_export.py exports/examples/synthetic_airspace_package --mode production
      - name: Validate SATIM calibration sets
        run: python scripts/validate_satim_calibration.py data/satim_calibration
      - name: Tests and full-data coverage
        id: tests
        shell: bash
        run: |
          set +e
          PYTEST_ADDOPTS="" pytest -q -m "not integration and not requires_thehub" \
            --cov --cov-report=term-missing:skip-covered 2>&1 | tee pytest-${{ matrix.python-version }}.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Upload failing pytest log
        if: failure() && steps.tests.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pytest-${{ matrix.python-version }}-failure
          path: pytest-${{ matrix.python-version }}.log
          if-no-files-found: error

  test-imagery:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev,imagery]" -r requirements-imagery.txt
      - run: pytest tests/test_imagery_*.py -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
      - name: Resolve immutable dependency lock
        run: |
          set -euo pipefail
          uv pip compile pyproject.toml --extra dev --extra api --extra federation \
            --universal --python-version 3.12 --no-header --no-annotate \
            -o /tmp/resolved.lock
          grep -F 'thehub-pr.git@f00f2da0e6abcc885a8133e5c8b7aeb9756f5df8' /tmp/resolved.lock
          ! grep -E '(^|[[:space:]])-e[[:space:]]+\.\./thehub-pr|\.\./thehub-pr/packages' /tmp/resolved.lock
          cp /tmp/resolved.lock resolved.lock
      - name: Upload fresh lock evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: resolved-lock-${{ github.sha }}
          path: resolved.lock
          if-no-files-found: warn
      - name: Verify committed lock matches fresh resolution
        run: |
          set -euo pipefail
          grep -F 'thehub-pr.git@f00f2da0e6abcc885a8133e5c8b7aeb9756f5df8' requirements.lock
          ! grep -E '(^|[[:space:]])-e[[:space:]]+\.\./thehub-pr|\.\./thehub-pr/packages' requirements.lock
          diff -u requirements.lock /tmp/resolved.lock

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev,api]"
      - name: Ruff
        run: ruff check .
      - name: Mypy (report-only)
        continue-on-error: true
        run: python -m mypy
