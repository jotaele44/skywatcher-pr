name: GUI runtime matrix

on:
  push:
    branches:
      - audit/gui-runtime-matrix-20260824
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  route-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r server/backend/requirements.txt
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Install bounded browser harness
        working-directory: frontend
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Install Chromium Firefox and WebKit
        working-directory: frontend
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Start read-only backend
        shell: bash
        run: |
          set -euo pipefail
          python -m uvicorn server.backend.main:app --host 127.0.0.1 --port 8000 > /tmp/skywatcher-api.log 2>&1 &
          echo $! > /tmp/skywatcher-api.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null 2>&1 || curl -fsS http://127.0.0.1:8000/api/apps/public-settings >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          cat /tmp/skywatcher-api.log
          exit 1
      - name: Start frontend
        working-directory: frontend
        shell: bash
        env:
          VITE_API_PROXY_TARGET: http://127.0.0.1:8000
        run: |
          set -euo pipefail
          npm run dev -- --host 127.0.0.1 --port 5173 --strictPort > /tmp/skywatcher-vite.log 2>&1 &
          echo $! > /tmp/skywatcher-vite.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/skywatcher-vite.log
          exit 1
      - name: Execute diagnostic route matrix
        working-directory: frontend
        run: node tests/gui-runtime-matrix.mjs
      - name: Upload GUI evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: skywatcher-gui-runtime-matrix
          path: frontend/artifacts/gui-runtime-matrix/
          if-no-files-found: error
          retention-days: 90
      - name: Dump logs on failure
        if: failure()
        run: |
          cat /tmp/skywatcher-api.log || true
          cat /tmp/skywatcher-vite.log || true
