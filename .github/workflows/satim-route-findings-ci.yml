name: SATIM Route Findings CI

on:
  push:
    paths:
      - 'tools/satim_route_findings/**'
      - '.github/workflows/satim-route-findings-ci.yml'
  pull_request:
    paths:
      - 'tools/satim_route_findings/**'
      - '.github/workflows/satim-route-findings-ci.yml'

permissions: {contents: read}

jobs:
  test-route-findings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
      - name: Install package
        working-directory: tools/satim_route_findings
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Run tests
        working-directory: tools/satim_route_findings
        run: pytest -q
      - name: Smoke test CLI
        working-directory: tools/satim_route_findings
        run: |
          mkdir -p /tmp/satim_route_findings_out
          satim-route-findings --input tests/fixtures --output /tmp/satim_route_findings_out
          test -f /tmp/satim_route_findings_out/route_findings_report.md
