name: Ruff order probe

on:
  push:
    branches:
      - feat/visual-reasoning-runtime-v0-2

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/visual-reasoning-runtime-v0-2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.16.3
      - name: Apply exact Ruff autofixes
        run: |
          ruff check --select I --fix src/skywatcher/satim/visual_reasoning_runtime.py tests/test_visual_reasoning_runtime_sensitivity_v0_2.py
          ruff check --select SIM --fix scripts/audit_visual_reasoning_runtime.py
          git diff --check
          if git diff --quiet; then
            echo "No Ruff changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/skywatcher/satim/visual_reasoning_runtime.py tests/test_visual_reasoning_runtime_sensitivity_v0_2.py scripts/audit_visual_reasoning_runtime.py
          git commit -m "chore: apply Ruff canonical formatting"
          git push origin HEAD:feat/visual-reasoning-runtime-v0-2
