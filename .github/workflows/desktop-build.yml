name: desktop-build

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"
  pull_request:
    branches: [main]
    paths:
      - "desktop/**"
      - "requirements-desktop.txt"
      - "pyproject.toml"
      - ".github/workflows/desktop-build.yml"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Build frontend (same-origin)
        env:
          VITE_API_BASE: ""
        run: |
          npm ci --no-audit --no-fund
          npm run build
        working-directory: frontend
      - name: Install Python dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r server/backend/requirements.txt -r requirements-desktop.txt pyinstaller
      - name: Freeze console build (for smoke test)
        env:
          PRII_CONSOLE: "1"
        run: pyinstaller desktop/pyinstaller.spec --distpath dist-smoke --noconfirm
      - name: Smoke test frozen app
        shell: python
        run: |
          import pathlib, subprocess, sys
          name = "PRII-SKYWATCHER"
          exe = pathlib.Path("dist-smoke") / name / (name + (".exe" if sys.platform == "win32" else ""))
          result = subprocess.run([str(exe), "--smoke"], timeout=120)
          sys.exit(result.returncode)
      - name: Freeze desktop app (windowed release)
        run: pyinstaller desktop/pyinstaller.spec --distpath dist-desktop --noconfirm
      - name: Package bundle
        shell: bash
        run: |
          cd dist-desktop
          if [ "$RUNNER_OS" = "macOS" ] && [ -d "PRII-SKYWATCHER.app" ]; then
            zip -qry "PRII-SKYWATCHER-${RUNNER_OS}.zip" "PRII-SKYWATCHER.app"
          else
            7z a -bd "PRII-SKYWATCHER-${RUNNER_OS}.zip" "PRII-SKYWATCHER" > /dev/null
          fi
      - name: Package .dmg (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cd dist-desktop
          staging="dmg-staging"
          rm -rf "$staging" && mkdir "$staging"
          cp -R "PRII-SKYWATCHER.app" "$staging/"
          ln -s /Applications "$staging/Applications"
          hdiutil create -volname "PRII-SKYWATCHER" -srcfolder "$staging" \
            -ov -format UDZO "PRII-SKYWATCHER-macOS.dmg"
          rm -rf "$staging"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: PRII-SKYWATCHER-${{ runner.os }}
          path: |
            dist-desktop/PRII-SKYWATCHER-*.zip
            dist-desktop/PRII-SKYWATCHER-*.dmg
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          files: |
            dist-desktop/PRII-SKYWATCHER-*.zip
            dist-desktop/PRII-SKYWATCHER-*.dmg
