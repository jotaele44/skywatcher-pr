name: Skywatcher CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this workflow only reads the repo (and uploads artifacts,
# which uses the runtime token, not GITHUB_TOKEN). Widen deliberately if a
# step ever needs to write back.
permissions:
  contents: read

# Supersede older runs of this workflow on the same ref: a newer push
# makes the in-flight result irrelevant, so cancel it and free the runner.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dev deps
        run: |
          # PRII_FETCH_HUB: ensure shared federation libs resolve
          if [ ! -d ../thehub-pr ]; then git clone --depth 1 --branch "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" https://github.com/jotaele44/thehub-pr.git ../thehub-pr || git clone --depth 1 https://github.com/jotaele44/thehub-pr.git ../thehub-pr; fi
          python -m pip install -r requirements-dev.txt httpx -r server/backend/requirements.txt
      - name: Federation manifest gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("federation.json").read_text())
          required = {
              "schema_version",
              "program_id",
              "repository_full_name",
              "federation_role",
              "hub_parent",
              "hub_callable_commands",
              "canonical_outputs",
              "federation_readiness_gate",
          }
          missing = sorted(required - set(manifest))
          assert not missing, f"federation.json missing required keys: {missing}"
          assert manifest["schema_version"] == "repo_federation_manifest_v1"
          assert manifest["program_id"] == "skywatcher-pr"
          assert manifest["hub_parent"] == "thehub-pr"
          assert "setup" in manifest["hub_callable_commands"]
          assert "test_suite" in manifest["hub_callable_commands"]
          gate = manifest["federation_readiness_gate"]
          assert isinstance(gate.get("ready_for_hub_discovery"), bool)
          assert isinstance(gate.get("ready_for_hub_live_execution"), bool)
          assert isinstance(gate.get("blocking_conditions"), list)
          print("federation manifest gate passed")
          PY
      - name: Validate airspace export contract (test mode passes, production rejects synthetic)
        run: |
          python scripts/validate_airspace_export.py exports/examples/synthetic_airspace_package --mode test
          if python scripts/validate_airspace_export.py exports/examples/synthetic_airspace_package --mode production; then
            echo "ERROR: production mode should reject synthetic rows" && exit 1
          else
            echo "OK: production mode correctly rejected synthetic rows"
          fi
      - name: Validate SATIM calibration sets
        run: python scripts/validate_satim_calibration.py data/satim_calibration
      - name: Tests
        run: pytest -q --cov --cov-report=term-missing:skip-covered

  test-imagery:
    # Imagery MCP server has its own optional dependency set (requirements-imagery.txt);
    # install it here and run the imagery suite so those tests are exercised in CI.
    # The base `test` job skips them cleanly when the extra is absent.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install imagery deps
        run: |
          # PRII_FETCH_HUB: ensure shared federation libs resolve
          if [ ! -d ../thehub-pr ]; then git clone --depth 1 --branch "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" https://github.com/jotaele44/thehub-pr.git ../thehub-pr || git clone --depth 1 https://github.com/jotaele44/thehub-pr.git ../thehub-pr; fi
          python -m pip install -r requirements-imagery.txt pytest
      - name: Imagery tests (mocked; live providers excluded)
        run: pytest tests/test_imagery_*.py -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  # Reproducible installs: recompiles requirements.lock from requirements.txt and
  # fails if the committed lock is stale, so a dependency change cannot merge
  # without its lockfile update. Mirrors moneysweep-pr/.github/workflows/lockfile.yml.
  # uv seeds the resolution from the existing lock, so an unrelated upstream
  # release does not spuriously fail this job.
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Recompile the lockfile
        run: |
          # PRII_FETCH_HUB: requirements.txt references ../thehub-pr editable paths
          if [ ! -d ../thehub-pr ]; then git clone --depth 1 --branch "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" https://github.com/jotaele44/thehub-pr.git ../thehub-pr || git clone --depth 1 https://github.com/jotaele44/thehub-pr.git ../thehub-pr; fi
          uv pip compile requirements.txt --universal --python-version 3.12 -o requirements.lock
      - name: Assert no drift
        run: |
          if ! git diff --exit-code requirements.lock; then
            echo "::error::requirements.lock is out of date with requirements.txt." \
              "Run: uv pip compile requirements.txt --universal --python-version 3.12 -o requirements.lock"
            exit 1
          fi

  # Lint and type gates, both REPORT-ONLY to start.
  #
  # ruff: this repo carries a ~1.4k-finding backlog (mostly UP006/UP035
  # annotation modernization and unsorted imports) inherited from before the
  # config existed. The job runs so the number is visible and can be worked down
  # per-subtree; mass-autofixing a flat-layout numerics repo in one pass is not
  # safe to bundle with CI configuration work. Drop continue-on-error once clear.
  #
  # mypy: scoped by [tool.mypy] `files` to src/skywatcher (12 findings today;
  # src/skywatcher/satim/artifacts is already clean).
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install lint deps
        run: |
          # PRII_FETCH_HUB: ensure shared federation libs resolve
          if [ ! -d ../thehub-pr ]; then git clone --depth 1 --branch "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" https://github.com/jotaele44/thehub-pr.git ../thehub-pr || git clone --depth 1 https://github.com/jotaele44/thehub-pr.git ../thehub-pr; fi
          python -m pip install ruff mypy -r requirements-dev.txt
      # GATING as of the backlog cleanup: the repo is ruff-clean under the
      # `ignore` list in pyproject.toml, which holds the remaining findings that
      # need judgement rather than an autofix. Anything outside that list is a
      # new violation and fails here.
      - name: Ruff
        run: ruff check .
      - name: Mypy (report-only)
        continue-on-error: true
        run: python -m mypy