name: SATIM Phase 2 Contracts

on:
  pull_request:
    paths:
      - 'fr24/calibration/satim_*.py'
      - 'fr24/calibration/run_phase2.py'
      - 'schemas/*.json'
      - 'tests/test_satim_*.py'
      - 'tests/fixtures/satim_phase2/**'
      - 'data/satim_fixtures/**'
      - 'docs/SATIM_*.md'
      - '.github/workflows/satim-phase2.yml'
  workflow_dispatch:

# Least privilege: this workflow only reads the repo (and uploads artifacts,
# which uses the runtime token, not GITHUB_TOKEN). Widen deliberately if a
# step ever needs to write back.
permissions:
  contents: read

jobs:
  satim-phase2-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Run SATIM Phase 1 and Phase 2 contract tests
        run: |
          python -m pytest \
            tests/test_satim_operationalization_phase1_contracts.py \
            tests/test_satim_phase2_raster_extraction.py \
            tests/test_satim_phase2_multidate_validation.py \
            tests/test_satim_phase2_gis_overlay.py \
            tests/test_satim_phase2_run_phase2.py
