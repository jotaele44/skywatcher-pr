name: Federation template drift

on: [push, pull_request]

permissions: {contents: read}

jobs:
  drift:
    runs-on: ubuntu-latest
    env:
      THEHUB_SHA: f00f2da0e6abcc885a8133e5c8b7aeb9756f5df8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Fetch pinned federation templates
        run: |
          git init ../thehub-pr
          git -C ../thehub-pr remote add origin https://github.com/jotaele44/thehub-pr.git
          git -C ../thehub-pr fetch --depth 1 origin "$THEHUB_SHA"
          git -C ../thehub-pr checkout --detach FETCH_HEAD
          test "$(git -C ../thehub-pr rev-parse HEAD)" = "$THEHUB_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install pyyaml
      - name: Render pinned templates
        run: |
          mkdir -p /tmp/skywatcher-rendered
          python ../thehub-pr/tools/render_federation_templates.py \
            --repo skywatcher-pr \
            --repo-root /tmp/skywatcher-rendered
      - name: Compare macOS launcher
        run: diff -u /tmp/skywatcher-rendered/PRII-SKYWATCHER.command PRII-SKYWATCHER.command
      - name: Compare Windows launcher
        run: |
          python - <<'PY'
          from pathlib import Path
          expected = Path('/tmp/skywatcher-rendered/PRII-SKYWATCHER.bat').read_text(encoding='utf-8')
          actual = Path('PRII-SKYWATCHER.bat').read_text(encoding='utf-8')
          assert actual == expected
          PY
      - name: Compare Linux launcher
        run: diff -u /tmp/skywatcher-rendered/PRII-SKYWATCHER.sh PRII-SKYWATCHER.sh
      - name: Compare federation schema
        run: diff -u /tmp/skywatcher-rendered/schemas/federation_export_manifest.schema.json schemas/federation_export_manifest.schema.json
      - name: Validate launcher modes and hardened divergences
        run: |
          test -x PRII-SKYWATCHER.command
          test -x PRII-SKYWATCHER.sh
          test ! -e Fix-Gatekeeper.command
          grep -F -- '-e .[desktop,federation]' requirements-desktop.txt
          ! grep -R -- '-e ../thehub-pr' requirements*.txt
          grep -F "$THEHUB_SHA" pyproject.toml
          grep -F "$THEHUB_SHA" requirements.lock
