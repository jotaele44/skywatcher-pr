name: Skywatcher CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {contents: read}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dev deps
        run: python -m pip install -e ".[dev,api]"
      - name: Federation manifest gate
        run: |
          python - <<'PY'
          import json
          manifest = json.load(open("federation.json", encoding="utf-8"))
          assert manifest["program_id"] == "skywatcher-pr"
          assert manifest["hub_parent"] == "thehub-pr"
          assert manifest["federation_readiness_gate"]["operational_cueing"] is False
          assert manifest["federation_readiness_gate"]["intent_inference"] is False
          PY
      - name: Validate airspace export contract
        run: |
          python scripts/validate_airspace_export.py exports/examples/synthetic_airspace_package --mode test
          ! python scripts/validate_airspace_export.py exports/examples/synthetic_airspace_package --mode production
      - name: Validate SATIM calibration sets
        run: python scripts/validate_satim_calibration.py data/satim_calibration
      - name: Tests
        run: pytest -q --cov --cov-report=term-missing:skip-covered

  test-imagery:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev,imagery]" -r requirements-imagery.txt
      - run: pytest tests/test_imagery_*.py -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
      - name: Verify immutable lock inputs
        run: |
          grep -F 'thehub-pr.git@f00f2da0e6abcc885a8133e5c8b7aeb9756f5df8' requirements.lock
          ! grep -E '(^|[[:space:]])-e[[:space:]]+\.\./thehub-pr|\.\./thehub-pr/packages' requirements.lock
          uv pip compile pyproject.toml --extra dev --extra api --extra federation --universal --python-version 3.12 -o /tmp/requirements.lock
          diff -u requirements.lock /tmp/requirements.lock

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev,api]"
      - name: Ruff (report-only)
        continue-on-error: true
        run: ruff check --statistics .
      - name: Mypy (report-only)
        continue-on-error: true
        run: python -m mypy
