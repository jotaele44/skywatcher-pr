name: Phase 0 adjudicated current-main merge

on:
  pull_request:
    branches:
      - agent/repository-hardening-phase-0
    types: [opened]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  merge:
    if: github.event.pull_request.head.ref == 'main' && github.event.pull_request.base.ref == 'agent/repository-hardening-phase-0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: agent/repository-hardening-phase-0
      - name: Merge, adjudicate, validate, and push
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          expected_main=09c8928109e25a3651f09ffff4c9414f0c83fdac
          branch=agent/repository-hardening-phase-0
          sync_pr=${{ github.event.pull_request.number }}
          git fetch origin main
          actual_main=$(git rev-parse origin/main)
          test "$actual_main" = "$expected_main"
          feature_head=$(git rev-parse HEAD)
          gh api repos/${{ github.repository }}/issues/$sync_pr/comments \
            -f body="## Phase 0 targeted merge validation started\n\n- Feature head: \`$feature_head\`\n- Main head: \`$actual_main\`\n- Full eleven-family CI will run on the connector-authored evidence successor."

          git config user.name phase0-sync-bot
          git config user.email actions@users.noreply.github.com
          set +e
          git merge --no-commit --no-ff "$actual_main"
          merge_rc=$?
          set -e
          test "$merge_rc" -eq 1

          expected_conflicts=$(cat <<'EOF'
          .github/workflows/ci.yml
          fr24/rlsm_unlabeled.py
          fr24/satim_engine.py
          fr24/satim_engine_core.py
          pyproject.toml
          scripts/federation_export.py
          scripts/rlsm_geocode_unlabeled.py
          scripts/rlsm_ocr_retry_tails.py
          src/skywatcher/fpim/aircraft_profile.py
          tests/test_aircraft_intelligence.py
          tests/test_fr24_todays_batch.py
          tests/test_maintenance.py
          tools/satim_engine/src/satim_engine/inventory.py
          EOF
          )
          actual_conflicts=$(git diff --name-only --diff-filter=U | sort)
          test "$actual_conflicts" = "$expected_conflicts"

          while IFS= read -r path; do
            git checkout --ours -- "$path"
          done <<< "$actual_conflicts"

          python - <<'PY'
          from pathlib import Path

          ci = Path('.github/workflows/ci.yml')
          text = ci.read_text()
          old_gate = '''          manifest = json.load(open("federation.json", encoding="utf-8"))
          assert manifest["program_id"] == "skywatcher-pr"
          assert manifest["hub_parent"] == "thehub-pr"
          assert manifest["federation_readiness_gate"]["operational_cueing"] is False
          assert manifest["federation_readiness_gate"]["intent_inference"] is False
          '''
          new_gate = '''          manifest = json.load(open("federation.json", encoding="utf-8"))
          required = {
              "schema_version", "program_id", "repository_full_name",
              "federation_role", "hub_parent", "hub_callable_commands",
              "canonical_outputs", "federation_readiness_gate",
          }
          missing = sorted(required - set(manifest))
          assert not missing, f"federation.json missing required keys: {missing}"
          assert manifest["program_id"] == "skywatcher-pr"
          assert manifest["hub_parent"] == "thehub-pr"
          gate = manifest["federation_readiness_gate"]
          assert isinstance(gate.get("ready_for_hub_discovery"), bool)
          assert isinstance(gate.get("ready_for_hub_live_execution"), bool)
          assert isinstance(gate.get("blocking_conditions"), list)
          assert gate["operational_cueing"] is False
          assert gate["intent_inference"] is False
          '''
          if old_gate not in text:
              raise SystemExit('expected Phase 0 federation gate block not found')
          text = text.replace(old_gate, new_gate)
          old_lint = '''      - name: Ruff (report-only)
        continue-on-error: true
        run: ruff check --statistics .
          '''
          new_lint = '''      - name: Ruff
        run: ruff check .
          '''
          if old_lint not in text:
              raise SystemExit('expected report-only Ruff block not found')
          ci.write_text(text.replace(old_lint, new_lint))

          pyproject = Path('pyproject.toml')
          text = pyproject.read_text()
          old = 'ignore = ["E501"]'
          new = '''ignore = [
  "E501",
  "E402",
  "B023",
]'''
          if old not in text:
              raise SystemExit('expected Phase 0 Ruff ignore list not found')
          pyproject.write_text(text.replace(old, new))
          PY

          git add $actual_conflicts
          git rm .github/workflows/phase0-sync-current-main.yml
          test -z "$(git diff --name-only --diff-filter=U)"

          validation_log=/tmp/phase0-sync-validation.log
          set +e
          {
            python -m pip install --upgrade pip
            python -m pip install -e '.[dev,api]'
            python -m pip install -e 'tools/satim_engine[dev]'
            ruff check --fix .
            ruff check .
            git add -A
            git diff --check
            PYTEST_ADDOPTS='' pytest -q \
              tests/test_aircraft_intelligence.py \
              tests/test_fpim_quarantine.py \
              tests/test_backend_api_security.py \
              tests/test_repository_policy.py \
              tests/test_safe_archive.py \
              tests/test_maintenance.py \
              tests/test_fr24_todays_batch.py \
              tools/satim_engine/tests/test_safe_archive.py \
              tools/satim_engine/tests/test_inventory.py
          } 2>&1 | tee "$validation_log"
          validation_rc=${PIPESTATUS[0]}
          set -e
          if [ "$validation_rc" -ne 0 ]; then
            tail_log=$(tail -n 160 "$validation_log")
            body=$(printf '## Phase 0 adjudicated merge failed targeted validation\n\n- Feature head: `%s`\n- Main head: `%s`\n\n```\n%s\n```\n\nNo merge commit was pushed.' "$feature_head" "$actual_main" "$tail_log")
            gh api repos/${{ github.repository }}/issues/$sync_pr/comments -f body="$body"
            exit "$validation_rc"
          fi

          git commit -m 'Merge current main into Phase 0 branch'
          merge_sha=$(git rev-parse HEAD)
          parent_line=$(git rev-list --parents -n 1 HEAD)
          test "$(wc -w <<< "$parent_line")" -eq 3
          test "$(awk '{print $2}' <<< "$parent_line")" = "$feature_head"
          test "$(awk '{print $3}' <<< "$parent_line")" = "$actual_main"
          git push origin "HEAD:$branch"

          body=$(printf '## Phase 0 adjudicated synchronization pushed\n\n- Previous feature head: `%s`\n- Current-main parent: `%s`\n- Two-parent merge head: `%s`\n- Conflict set: 13 exact paths\n- Ruff gate: passing\n- Targeted Phase 0 test set: passing\n- Temporary synchronization workflow: removed from final tree\n\nPR #110 remains draft and was not merged.' "$feature_head" "$actual_main" "$merge_sha")
          gh api repos/${{ github.repository }}/issues/$sync_pr/comments -f body="$body"
