name: Backend core

on:
  pull_request:
    paths-ignore: ["frontend/**", "data/**"]
  push:
    branches: [main]
    paths-ignore: ["frontend/**", "data/**"]

permissions: {contents: read}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,api]"
      - run: python scripts/check_repo_hygiene.py
      - run: skywatcher --root "$GITHUB_WORKSPACE" doctor
      - run: skywatcher --root "$GITHUB_WORKSPACE" validate
      - run: |
          skywatcher --root "$GITHUB_WORKSPACE" export-source /tmp/a.zip
          skywatcher --root "$GITHUB_WORKSPACE" export-source /tmp/b.zip
          cmp /tmp/a.zip /tmp/b.zip
      - run: pytest -m "not integration and not requires_data and not requires_thehub"
      - run: python -m build
      - name: True isolated wheel gate
        run: |
          python -m venv /tmp/skywatcher-wheel
          /tmp/skywatcher-wheel/bin/python -m pip install --upgrade pip
          /tmp/skywatcher-wheel/bin/python -m pip install --force-reinstall dist/*.whl
          mkdir -p /tmp/skywatcher-empty
          cd /tmp/skywatcher-empty
          if /tmp/skywatcher-wheel/bin/skywatcher validate; then
            echo "validate must fail when repository schemas are absent"
            exit 1
          fi
          /tmp/skywatcher-wheel/bin/skywatcher --root "$GITHUB_WORKSPACE" doctor
          /tmp/skywatcher-wheel/bin/skywatcher --root "$GITHUB_WORKSPACE" validate | tee /tmp/schema-validation.json
          grep -E '"schemas_checked": (4[3-9]|[5-9][0-9])' /tmp/schema-validation.json
          /tmp/skywatcher-wheel/bin/python -c "import skywatcher, fr24, pipeline, aircraft_intelligence; from skywatcher.cli import build_parser; build_parser()"

  federation-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,federation]"
      - run: PYTEST_ADDOPTS="" pytest -q tests/test_maintenance.py tests/test_federation_export.py

  tool-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e "tools/satim_engine[dev]"
      - run: pytest tools/satim_engine/tests
      - run: python -m pip install -e "tools/satim_route_findings[dev]"
      - run: pytest tools/satim_route_findings/tests
