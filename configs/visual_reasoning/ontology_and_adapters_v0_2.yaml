spec_version: 0.2.0
evidence_layers:
  L0: RAW_BYTES
  L1: PIXEL_OBSERVATION
  L2: DERIVED_IMAGE_FEATURE
  L3: VISUAL_CANDIDATE
  L4: SUPPORTED_SCENE_FEATURE
  L5: RELATIONAL_INFERENCE
  L6: LOCATION_CANDIDATE
  L7: EXTERNAL_BINDING
  L8: CERTIFIED_FINDING
classes:
  zoom: [UNDERZOOMED, CONTEXTUAL, OPTIMAL_ZOOM, OVERZOOMED, UNKNOWN]
  shadow: [PHYSICALLY_PLAUSIBLE_SHADOW, POSSIBLE_SHADOW, INCONSISTENT_SHADOW, CLIPPED_BLACK, RENDERING_DARKENING_CANDIDATE, UNRESOLVED]
  seam: [NO_SEAM_EVIDENCE, LOW_DISCREPANCY_SEAM, MODERATE_DISCREPANCY_SEAM, HIGH_DISCREPANCY_SEAM, ORTHORECTIFICATION_MISMATCH_CANDIDATE, TEMPORAL_MOSAIC_MISMATCH_CANDIDATE, UNRESOLVED]
  artifact: [JPEG_BLOCKING, RINGING, HALO, SHARPENING_OVERSHOOT, INTERPOLATION_ARTIFACT, PIXEL_REPLICATION, GHOSTING, ORTHOMOSAIC_GHOST, FEATURE_DUPLICATION, FEATURE_TRUNCATION, TILE_EDGE, MASK_EDGE, NO_DATA_FILL, WARP, MIPMAP_LOD_TRANSITION, SCREEN_CAPTURE_ARTIFACT, UI_OVERLAY_ARTIFACT, UNKNOWN_DIGITAL_ARTIFACT]
  palm_vegetation: [PALM_TREE, PALM_TREE_CANDIDATE, PALM_LIKE_CROWN, OTHER_TREE, UNKNOWN_TREE, FULL_CANOPY, PARTIAL_CANOPY, CANOPY_GAP, UNKNOWN_TROPICAL_CANOPY]
  water: [RIVER, STREAM, CANAL, RESERVOIR, LAKE, POND, LAGOON, ESTUARINE_OR_TIDAL_WATER, WETLAND_OPEN_WATER, FLOODED_AREA, UNKNOWN_WATERBODY, WATER_CANDIDATE]
  infrastructure: [ROAD, UNPAVED_ROAD, ACCESS_ROAD, DRIVEWAY, BRIDGE, CULVERT_CANDIDATE, RAIL, RUNWAY, TAXIWAY, APRON, PARKING, PIER, DAM, SPILLWAY, INTAKE, CANAL_INFRASTRUCTURE, AQUEDUCT, PIPELINE_CORRIDOR, TANK, PUMP_STATION_CANDIDATE, WATER_TREATMENT_STRUCTURE, DRAINAGE_CHANNEL, RETENTION_BASIN, SUBSTATION, TRANSMISSION_CORRIDOR, POLE_TOWER, SOLAR_ARRAY, WIND_TURBINE, WAREHOUSE, PROCESS_BUILDING, STORAGE_YARD, STOCKPILE, CONVEYOR, SILO, TANK_FARM, PROCESSING_PAD, MAST, ANTENNA, RADOME_CANDIDATE, UNKNOWN_INFRASTRUCTURE]
  extractive: [ACTIVE_QUARRY_CANDIDATE, INACTIVE_QUARRY_CANDIDATE, EXTRACTIVE_SITE_CANDIDATE, BORROW_PIT_CANDIDATE, OPEN_PIT_CANDIDATE, AGGREGATE_PROCESSING_SITE_CANDIDATE, NATURAL_ROCK_EXPOSURE, CONSTRUCTION_CUT, LANDSLIDE_OR_SCARP_CANDIDATE, UNRESOLVED_GROUND_DISTURBANCE]
  excavation: [TRENCH, FOUNDATION_EXCAVATION, ROAD_CUT, UTILITY_TRENCH, BORROW_EXCAVATION, EARTHWORK, GRADING, CUT_AND_FILL, CONSTRUCTION_PAD, SPOIL_PILE, DITCH, DRAINAGE_EXCAVATION, DEMOLITION_DISTURBANCE, UNKNOWN_EXCAVATION]
  portal_like: [PORTAL_LIKE_FEATURE, CIVIL_OPENING_CANDIDATE, NATURAL_OPENING_CANDIDATE, SHADOW, ARTIFACT, UNRESOLVED]
  location: [L0_UNKNOWN, L1_REGION, L2_MUNICIPALITY_CITY, L3_NEIGHBORHOOD_BARRIO, L4_ROAD_CORRIDOR, L5_LOCAL_CLUSTER, L6_EXACT_SCENE_ALIGNMENT, L7_PIXEL_TO_GROUND]
adapters:
  screenshot_custody:
    producer: RLSM
    required: [source_bytes_sha256, frame_id, width_px, height_px]
    forbidden: [terrain_interpretation]
  ocr:
    producer: RLSM
    required: [raw_text, bbox_px, ocr_confidence, source_frame_id]
    forbidden: [location_identity]
  ui_mask:
    producer: RLSM
    required: [mask_geometry, mask_class, confidence]
    forbidden: [ground_object_identity]
  map_state:
    producer: RLSM/Core
    required: [provider_if_observed, bearing_if_observed, zoom_if_observed, uncertainty]
    forbidden: [exact_location_without_binding]
  visual_reasoning:
    producer: SATIM
    required: [observations, measurements, reason_codes, parameter_set_version, rule_set_version]
    forbidden: [mission_intent, legal_identity_without_external_binding]
  scene_locator_reference:
    producer: external_reference_adapter
    required: [source_snapshot_id, geometry, stable_id_if_available, retrieval_provenance]
    forbidden: [nearest_only_identity]
  external_identity_binding:
    producer: Core/domain_adapter
    required: [authoritative_binding_or_certified_geometry, candidate_set, binding_method]
    forbidden_identity_methods: [NAME_ONLY, NORMALIZED_NAME_ONLY, COUNT_EQUALITY, NEAREST_ONLY, PROXIMITY_ONLY, SAME_CATEGORY, SOURCE_ABSENCE]
