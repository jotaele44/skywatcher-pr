name: Skywatcher recovery successor v1 — acquisition and identity
on:
  push:
    branches: [recovery/floot-baseline-2026-09-30]
    paths:
      - ".recovery/skywatcher-successor-v1/**"
      - ".github/workflows/recovery-skywatcher-successor-v1.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  successor-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
      - name: Reproduce exact 134-test baseline
        shell: bash
        run: bash .recovery/skywatcher-exact/run_exact.sh
      - name: Apply successor v1
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/recovered"
          cp .recovery/skywatcher-successor-v1/skywatcherAcquisition.tsx "$ROOT/helpers/skywatcherAcquisition.tsx"
          cp .recovery/skywatcher-successor-v1/skywatcherAcquisition.spec.tsx "$ROOT/helpers/skywatcherAcquisition.spec.tsx"
          cp .recovery/skywatcher-successor-v1/skywatcherIdentity.tsx "$ROOT/helpers/skywatcherIdentity.tsx"
          cp .recovery/skywatcher-successor-v1/skywatcherIdentity.spec.tsx "$ROOT/helpers/skywatcherIdentity.spec.tsx"
          cd "$ROOT"
          sha256sum helpers/skywatcherAcquisition.tsx helpers/skywatcherAcquisition.spec.tsx helpers/skywatcherIdentity.tsx helpers/skywatcherIdentity.spec.tsx > successor-v1-overlay-hashes.txt
      - name: Execute successor v1 regression
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/recovered"
          mapfile -t exec_specs < <(awk -F '\t' '$2=="EXECUTABLE"{print $1}' recovery-spec-classification.tsv)
          exec_specs+=(helpers/skywatcherAcquisition.spec.tsx helpers/skywatcherIdentity.spec.tsx)
          set +e
          npx vitest run --config recovery.vitest.config.mts --reporter=verbose "${exec_specs[@]}" 2>&1 | tee successor-v1-vitest.log
          status=${PIPESTATUS[0]}
          set -e
          echo "$status" > successor-v1-test-exit.txt
          test "$status" = "0"
          grep -q "146 passed" successor-v1-vitest.log
      - name: Production build
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/recovered"
          set +e
          npx vite build 2>&1 | tee successor-v1-build.log
          status=${PIPESTATUS[0]}
          set -e
          echo "$status" > successor-v1-build-exit.txt
          test "$status" = "0"
      - name: Freeze successor v1 receipt
        shell: bash
        run: |
          cd "$RUNNER_TEMP/recovered"
          {
            echo "schema=skywatcher-recovery-successor/v1"
            echo "baseline_tests=134"
            echo "successor_v1_tests=146"
            echo "application_plane_separate_from_acquisition=TRUE"
            echo "space_track_credentials=DEFERRED_BLOCKED"
            echo "observation_norad_identity=AUTHORITATIVE_EXACT_BINDING_ONLY"
            echo "name_time_distance_proximity_identity=DENY"
            echo "rlsm=FAIL_CLOSED_UNTIL_PROFILES_CLASSES_HASHES_CLOSE"
            echo "state=PASS"
          } > successor-v1-receipt.txt
          sha256sum package-lock.json successor-v1-overlay-hashes.txt successor-v1-vitest.log successor-v1-build.log successor-v1-receipt.txt > successor-v1-evidence-hashes.txt
      - name: Upload successor v1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skywatcher-recovery-successor-v1
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/recovered/package-lock.json
            ${{ runner.temp }}/recovered/successor-v1-overlay-hashes.txt
            ${{ runner.temp }}/recovered/successor-v1-vitest.log
            ${{ runner.temp }}/recovered/successor-v1-test-exit.txt
            ${{ runner.temp }}/recovered/successor-v1-build.log
            ${{ runner.temp }}/recovered/successor-v1-build-exit.txt
            ${{ runner.temp }}/recovered/successor-v1-receipt.txt
            ${{ runner.temp }}/recovered/successor-v1-evidence-hashes.txt
